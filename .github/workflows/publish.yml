# Publish `bedblend` to PyPI on a tagged release, via PyPI Trusted Publishing (OIDC), NO stored token
# (ADR-0061). One-time human setup: add a PyPI "pending publisher" for project `bedblend`, owner
# `fsantibanezleal`, repo `CAOS_BedBlend`, workflow `publish.yml`, environment `pypi`. After that a
# pushed tag `vX.XX.XXX` (or a published GitHub Release) builds and uploads tokenlessly.
name: publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-install the wheel in a clean venv and run a real pile (the package contract)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import bedblend as bb

          # Build a real pile with trucks, a dozer and a plan, then reclaim it. This is the package
          # contract: an installed wheel must be able to run the whole system from a clean venv.
          REPOSE = 37.0
          terrain = bb.Terrain.flat(48, 48, 2.5)
          plan = bb.rectangular_yard(n_areas=1, area_width_m=70.0, area_length_m=70.0,
                                     bench_height_m=8.0, n_benches=1)
          plan.row_spacing_m, plan.tip_spacing_m = 10.0, 8.0
          plan.areas[0].access_xy = (70.0, 0.0)
          fleet = bb.Fleet.of(3, bb.TruckSpec(), (110.0, 10.0), repose_deg=REPOSE)
          loads = bb.payloads_from(bb.dig_sequence(n_loads=90, seed=7), seed=7)

          res = bb.build(terrain, plan, fleet, loads, repose_deg=REPOSE)
          assert res.placed, "the smoke build placed nothing"

          # The invariants that made this version necessary.
          bb.assert_stable(res.terrain, REPOSE)
          res.model.assert_consistent(res.terrain)
          n_over, worst = bb.count_over_repose(res.terrain.z, res.terrain.nx, res.terrain.ny,
                                               res.terrain.cell_m, REPOSE)
          assert n_over == 0, f"{n_over} cell pairs over repose, worst {worst:.1f} deg"

          cuts = bb.campaign(res.terrain, res.model,
                             bb.ReclaimFace(method=bb.ReclaimMethod.FULL_HEIGHT, depth_m=10.0,
                                            width_m=200.0),
                             cut_tonnes=1500.0, n_cuts=10, repose_deg=REPOSE)
          assert cuts, "the smoke pile produced no cuts"
          for k, c in enumerate(cuts):
              s = sum(c.provenance.values())
              assert abs(s - 1) < 1e-9, f"provenance of cut {k} summed to {s}"

          print(f"smoke OK: {bb.__version__}, {len(res.placed)} loads placed, "
                f"{len(cuts)} cuts, 0 pairs over repose, "
                f"profiles {res.profile_counts()}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC: PyPI mints a short-lived token, nothing is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
